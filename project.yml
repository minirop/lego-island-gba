name: lego
sha1: 00fe8d6f16a8381d25b12cd0b5a45d54fca6ad0e
entry: Init
rom:
  address: 0x08000000
  size: 8M
  segments:
    - name: crt0
      format: asm
      address: 0x000000
      size: 0x240
    - name: code_000300
      format: c
      address: 0x000300
      size: 0x8c
    - name: code_0004dc
      format: c
      address: 0x0004dc
      size: 0x394
    - name: code_002160
      format: c
      address: 0x002160
      size: 0x28
    - name: code_0496e8
      format: c
      address: 0x0496e8
    - name: code_0004dc
      format: c
      section: rodata
      address: 0x049700
      size: 0x5c
    - name: code_002160
      format: c
      section: rodata
      address: 0x04978c
      size: 0x4
build:
  files:
    ofiles:
      - src/*.o
      - asm/*.o
  constants:
    agbcc: /home/minirop/git/fireemblem8u/tools/agbcc
    as: $(DEVKITARM)/bin/arm-none-eabi-as
    cc1: $(AGBCC)/bin/old_agbcc
    cc1flags: -mthumb-interwork -Wimplicit -Wparentheses -O2 -fhex-asm
    asflags: -mcpu=arm7tdmi -mthumb-interwork -I asminclude
    symbols: symbols.txt
    ldscript: ldscript.txt
    ld: $(DEVKITARM)/bin/arm-none-eabi-ld
    objcopy: $(DEVKITARM)/bin/arm-none-eabi-objcopy
  commands:
    - folder: asm
      extension: s
      exec:
        - $(AS) $(ASFLAGS) $(NAME).s -o $(NAME).o
    - folder: src
      extension: c
      exec:
        - $(CC1) $(CC1FLAGS) $(NAME).c -o $(NAME).s
        - $(AS) $(ASFLAGS) $(NAME).s -o $(NAME).o
    - $(LD) -T $(SYMBOLS) -T $(LDSCRIPT) -Map $(ROM).map $(OFILES) $(AGBCC)/lib/libgcc.a -o $(ROM).elf
    - $(OBJCOPY) -O binary --pad-to 0x8000000 $(ROM).elf $(ROM).gba
